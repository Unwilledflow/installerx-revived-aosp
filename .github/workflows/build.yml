name: Build stable AOSP module
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-aosp-module
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    env:
      UPSTREAM: wxxsfxyzm/InstallerX-Revived
      APP_ID: com.android.packageinstaller
      VERSION_CODE_OFFSET: 1000000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        with:
          persist-credentials: false

      - name: Check upstream stable release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" == public ]] || { echo 'Magisk needs a public update source.'; exit 1; }
          TAG=$(gh api "repos/$UPSTREAM/releases/latest" --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Unexpected stable tag format'; exit 1; }
          if [[ -f update.json ]] && [[ "$(jq -r .version update.json)" == "$TAG" ]]; then
            echo "Already built $TAG"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7
        if: steps.upstream.outputs.tag != ''
        with:
          repository: ${{ env.UPSTREAM }}
          ref: refs/tags/${{ steps.upstream.outputs.tag }}
          path: upstream
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # actions/setup-java v6
        if: steps.upstream.outputs.tag != ''
        with:
          distribution: zulu
          java-version: '25'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: steps.upstream.outputs.tag != ''
        with:
          packages: 'platforms;android-37 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # gradle/actions v6
        if: steps.upstream.outputs.tag != ''
        with:
          build-scan-publish: false
          cache-disabled: true

      - name: Build and verify signed APK
        if: steps.upstream.outputs.tag != ''
        timeout-minutes: 90
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MIUIX_PACKAGES_TOKEN }}
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEY_STORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing signing credential: $name"; exit 1; }
          done
          last=0
          if [[ -f update.json ]]; then last=$(jq -er '.versionCode | numbers' update.json); fi
          code=$(( VERSION_CODE_OFFSET + $(git -C upstream rev-list --count HEAD) ))
          [[ "$code" -gt "$last" && "$code" -le 2100000000 ]] || { echo 'Invalid or non-increasing versionCode'; exit 1; }
          printf '%s\n' "$code" > "$RUNNER_TEMP/module-code"

          export KEYSTORE_FILE
          KEYSTORE_FILE=$(mktemp "$RUNNER_TEMP/installerx-keystore.XXXXXX")
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$SIGNING_KEY_STORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          unset SIGNING_KEY_STORE_BASE64
          keytool -exportcert -keystore "$KEYSTORE_FILE" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/expected.der"
          read -r expected _ < <(sha256sum "$RUNNER_TEMP/expected.der")
          [[ -f signer.sha256 && "$(< signer.sha256)" == "$expected" ]] || { echo 'Signing certificate does not match signer.sha256'; exit 1; }

          file=upstream/app/build.gradle.kts
          [[ $(grep -cF 'versionCode = project.getGitCommitCount()' "$file") == 1 ]] || { echo 'Upstream versionCode logic changed'; exit 1; }
          [[ $(grep -cF 'versionName = project.getBaseVersionName()' "$file") == 1 ]] || { echo 'Upstream versionName logic changed'; exit 1; }
          sed -i "s/versionCode = project.getGitCommitCount()/versionCode = $code/" "$file"
          sed -i 's/versionName = project.getBaseVersionName()/versionName = providers.gradleProperty("VERSION_NAME").get()/' "$file"
          (cd upstream && bash ./gradlew assembleStableRelease -PAPP_ID="$APP_ID" -PVERSION_NAME="$TAG")
          mapfile -d '' -t apks < <(find upstream/app/build/outputs/apk -type f -ipath '*/stable/release/*.apk' -print0)
          [[ ${#apks[@]} == 1 ]] || { echo 'Expected exactly one stable release APK'; exit 1; }
          bt="$ANDROID_HOME/build-tools/37.0.0"
          badging=$("$bt/aapt2" dump badging "${apks[0]}")
          [[ "$badging" == "package: name='$APP_ID' versionCode='$code' versionName='$TAG'"* ]]
          certs=$("$bt/apksigner" verify --print-certs "${apks[0]}")
          actual=$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<< "$certs")
          [[ "$actual" == "$expected" ]] || { echo 'APK signer mismatch'; exit 1; }
          cp "${apks[0]}" "$RUNNER_TEMP/PackageInstaller.apk"

      - name: Pack, publish, and update Magisk feed
        if: steps.upstream.outputs.tag != ''
        timeout-minutes: 10
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          code=$(< "$RUNNER_TEMP/module-code")
          out="$RUNNER_TEMP/module"
          cp -a module "$out"
          dir="$out/system/priv-app/PackageInstaller"
          mkdir -p "$dir/oat" "$dir/lib"
          touch "$dir/oat/.replace" "$dir/lib/.replace"
          cp "$RUNNER_TEMP/PackageInstaller.apk" "$dir/PackageInstaller.apk"
          feed="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$BRANCH"
          cat > "$out/module.prop" <<EOF
          id=com.android.packageinstaller
          name=InstallerX Revived (AOSP, Stable)
          version=$TAG
          versionCode=$code
          author=wxxsfxyzm (app), ByteJuno (module base), $GITHUB_REPOSITORY_OWNER (build)
          description=Self-signed stable InstallerX Revived for AOSP PackageInstaller
          updateJson=$feed/update.json
          EOF
          zip="InstallerX-Revived-AOSP-$TAG.zip"
          (cd "$out" && zip -qr9 "$RUNNER_TEMP/$zip" .)
          unzip -tq "$RUNNER_TEMP/$zip"

          printf 'Stable build of [InstallerX Revived %s](https://github.com/%s/releases/tag/%s).\n\n[APK source at upstream commit](https://github.com/%s/tree/%s). Build changes: applicationId, versionCode and signing key. Inspect this workflow and module source in this repository.\n' \
            "$TAG" "$UPSTREAM" "$TAG" "$UPSTREAM" "$(git -C upstream rev-parse HEAD)" > changelog.md
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-state" 2>/dev/null; then
            echo 'Release already exists but is not in update.json. Inspect it before retrying; nothing was overwritten.'
            exit 1
          else
            gh release create "$TAG" "$RUNNER_TEMP/$zip" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "InstallerX Revived $TAG" --notes-file changelog.md --latest
          fi
          jq -n --arg v "$TAG" --argjson c "$code" \
            --arg z "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$zip" \
            --arg l "$feed/changelog.md" '{version:$v,versionCode:$c,zipUrl:$z,changelog:$l}' > update.json
          gh auth setup-git
          git add update.json changelog.md signer.sha256
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish stable $TAG"
          git push origin "HEAD:refs/heads/$BRANCH"
